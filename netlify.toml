[build]
  command = "npm run build"
  publish = "dist/client"

[build.environment]
  NODE_VERSION = "24"

[[redirects]]
  from = "/checklists"
  to = "/checklists.html"
  status = 200

[[redirects]]
  from = "/checklists/"
  to = "/checklists.html"
  status = 200

[[redirects]]
  from = "/thanks"
  to = "/thanks.html"
  status = 200

[[redirects]]
  from = "/thanks/"
  to = "/thanks.html"
  status = 200

[[redirects]]
  from = "/thank"
  to = "/thanks.html"
  status = 200

[[redirects]]
  from = "/thank/"
  to = "/thanks.html"
  status = 200
